
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFX Editor</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    background: #f5f1e9;
    color: #35332e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
    max-width: 460px;
    margin: 50px auto;
    padding: 28px;
    background: #fffdf8;
    border: 1px solid #e7e0d4;
    border-radius: 14px;
}

h1 {
    margin: 0 0 8px;
    font-size: 27px;
    font-weight: 650;
}

.description {
    margin: 0 0 28px;
    color: #777268;
    font-size: 14px;
    line-height: 1.7;
}

.section {
    margin-top: 24px;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    background: #f7f4ee;
    border: 1px solid #ded7ca;
    border-radius: 8px;
    font-size: 13px;
}

input[type="number"] {
    width: 100%;
    padding: 12px;
    background: #fffdf8;
    border: 1px solid #ded7ca;
    border-radius: 8px;
    font-size: 16px;
}

input[type="range"] {
    width: 100%;
    accent-color: #77705f;
}

.value {
    margin-top: 8px;
    font-size: 14px;
    color: #777268;
}

button {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    background: #514d43;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
}

button:disabled {
    background: #b8b3a9;
}

#status {
    margin-top: 18px;
    font-size: 13px;
    line-height: 1.6;
    color: #777268;
}

#editor {
    display: none;
}
</style>
</head>
<body>

<main>
    <h1>GFX Editor</h1>
    <p class="description">Minecraft Bedrock Editionの描画距離を突破できます。</p>

    <div class="section">
        <label for="fileInput">options.txtを選択</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div id="editor">
        <div class="section">
            <label for="chunkInput">描画距離（チャンク）</label>
            <input type="number" id="chunkInput" min="1" max="256" value="8">
            <input type="range" id="chunkSlider" min="1" max="256" value="8">
            <div class="value" id="blockValue">128ブロック</div>
        </div>

        <button id="downloadButton">編集したファイルをダウンロード</button>
    </div>

    <div id="status">Minecraft/games/com.mojang/minecraftpe 内の options.txt を選択してください。</div>
</main>

<script>
const fileInput = document.getElementById("fileInput");
const editor = document.getElementById("editor");
const chunkInput = document.getElementById("chunkInput");
const chunkSlider = document.getElementById("chunkSlider");
const blockValue = document.getElementById("blockValue");
const status = document.getElementById("status");
const downloadButton = document.getElementById("downloadButton");

let fileContent = "";
let fileName = "options.txt";
let settingPattern = null;

function updateValue(value) {
    const chunks = Math.max(1, Math.min(256, Number(value) || 1));
    chunkInput.value = chunks;
    chunkSlider.value = chunks;
    blockValue.textContent = `${chunks * 16}ブロック`;
}

chunkInput.addEventListener("input", () => {
    updateValue(chunkInput.value);
});

chunkSlider.addEventListener("input", () => {
    updateValue(chunkSlider.value);
});

fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];

    editor.style.display = "none";
    fileContent = "";
    settingPattern = null;

    if (!file) {
        status.textContent = "ファイルを選択してください。";
        return;
    }

    if (file.name !== "options.txt") {
        status.textContent = "options.txt ファイルを選択してください。";
        fileInput.value = "";
        return;
    }

    try {
        fileContent = await file.text();
        fileName = file.name;

        const patterns = [
            /(["']?gfx_viewdistance["']?\s*[:=]\s*)(\d+)/,
            /(gfx_viewdistance\s*=\s*)(\d+)/
        ];

        for (const pattern of patterns) {
            const match = fileContent.match(pattern);
            if (match) {
                settingPattern = {
                    pattern,
                    prefix: match[1],
                    value: Number(match[2])
                };
                break;
            }
        }

        if (!settingPattern) {
            status.textContent = "gfx_viewdistance が見つかりませんでした。";
            return;
        }

        updateValue(settingPattern.value);
        editor.style.display = "block";
        status.textContent = "ファイルを読み込みました。";
    } catch {
        status.textContent = "ファイルを読み込めませんでした。";
    }
});

downloadButton.addEventListener("click", () => {
    if (!settingPattern || !fileContent) {
        status.textContent = "ファイルを読み込んでください。";
        return;
    }

    const chunks = Math.max(1, Math.min(256, Number(chunkInput.value) || 1));
    const blocks = chunks * 16;

    const updatedContent = fileContent.replace(
        settingPattern.pattern,
        `${settingPattern.prefix}${blocks}`
    );

    const blob = new Blob([updatedContent], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = fileName;
    link.click();

    URL.revokeObjectURL(url);
    status.textContent = "options.txt をダウンロードしました。";
});
</script>

</body>
</html>
