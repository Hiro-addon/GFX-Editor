
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFX Editor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  background: #F7F5EF;
  color: #333333;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  max-width: 620px;
  margin: auto;
}

header {
  padding: 30px 0;
}

header h1 {
  font-size: 25px;
  font-weight: 700;
  margin: 0;
}

header p {
  color: #888888;
  font-size: 13px;
  margin-top: 8px;
}

.panel {
  background: #FFFFFF;
  border: 1px solid #E8E5DD;
  border-radius: 12px;
  padding: 22px;
  margin: 16px 0;
}

h2 {
  font-size: 16px;
  margin: 0 0 18px;
  font-weight: 650;
}

.drop {
  border: 1px dashed #C9C6BD;
  border-radius: 9px;
  padding: 25px 15px;
  text-align: center;
  background: #FCFBF8;
}

.drop p {
  color: #888888;
  font-size: 13px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 7px;
  padding: 12px 17px;
  background: #547D65;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #41664F;
}

button.secondary {
  background: #F0EFEA;
  color: #444444;
  border: 1px solid #E3E0D8;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

input[type="range"] {
  width: 100%;
  accent-color: #547D65;
  margin: 22px 0;
}

input[type="number"] {
  width: 100%;
  padding: 12px;
  background: #FFFFFF;
  color: #333333;
  border: 1px solid #DCD9D0;
  border-radius: 7px;
  font-size: 16px;
  margin-top: 9px;
}

.big {
  text-align: center;
  font-size: 48px;
  font-weight: 700;
  color: #333333;
}

.sub {
  text-align: center;
  color: #888888;
  font-size: 13px;
}

.bounds {
  display: flex;
  justify-content: space-between;
  color: #999999;
  font-size: 12px;
}

label {
  font-size: 13px;
  color: #555555;
}

.result {
  background: #F8F7F3;
  border: 1px solid #E8E5DD;
  border-radius: 9px;
  padding: 17px;
  margin-top: 20px;
}

.result small {
  color: #888888;
}

.result strong {
  display: block;
  color: #547D65;
  font-size: 34px;
  margin: 5px 0;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.actions button {
  flex: 1;
}

.status {
  font-size: 13px;
  color: #888888;
  margin-top: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.success {
  color: #547D65;
}

.error {
  color: #C45A5A;
}

footer {
  text-align: center;
  color: #AAAAAA;
  font-size: 12px;
  padding: 25px 0;
}

.hidden {
  display: none;
}

@media (max-width: 450px) {
  body {
    padding: 14px;
  }

  .panel {
    padding: 18px;
  }

  .actions {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>GFX Editor</h1>
  <p>Minecraft Bedrock Edition</p>
</header>

<section class="panel">

  <h2>設定ファイルを読み込む</h2>

  <div class="drop" id="drop">

    <p>
      Minecraft/games/com.mojang/minecraftpe<br>
      内の options.txt を選択
    </p>

    <button class="secondary" id="choose">
      options.txt を選択
    </button>

    <input
      type="file"
      id="file"
      class="hidden"
      accept=".txt"
    >

    <p id="filename">ファイル未選択</p>

  </div>

  <div class="status" id="loadstatus">
    options.txt のみ読み込みできます。
  </div>

</section>

<section class="panel">

  <h2>描画距離を変更</h2>

  <div class="big">
    <span id="chunkval">16</span>
  </div>

  <div class="sub">チャンク</div>

  <input
    type="range"
    id="slider"
    min="1"
    max="96"
    step="1"
    value="16"
  >

  <div class="bounds">
    <span>1チャンク</span>
    <span>96チャンク</span>
  </div>

  <br>

  <label for="chunkinput">
    チャンク数を直接入力
  </label>

  <input
    type="number"
    id="chunkinput"
    min="1"
    max="96"
    step="1"
    value="16"
  >

  <div class="result">

    <small>gfx_viewdistance</small>

    <strong id="blockval">256</strong>

    <small>ブロック</small>

  </div>

  <div class="actions">

    <button id="save" disabled>
      ダウンロード
    </button>

    <button class="secondary" id="copy">
      数値をコピー
    </button>

  </div>

  <div class="status" id="savestatus">
    ファイルを読み込んでください。
  </div>

</section>

<footer>
  GFX Editor
</footer>

</main>

<script>

const $ = id => document.getElementById(id);

let originalText = null;
let fileName = "options.txt";
let matchInfo = null;

function setChunks(value) {

  const n = Math.max(
    1,
    Math.min(96, Math.round(Number(value) || 1))
  );

  $("slider").value = n;
  $("chunkinput").value = n;
  $("chunkval").textContent = n;
  $("blockval").textContent = n * 16;

}

$("slider").addEventListener("input", e => {
  setChunks(e.target.value);
});

$("chunkinput").addEventListener("change", e => {
  setChunks(e.target.value);
});

$("choose").onclick = () => {
  $("file").click();
};

function detect(text) {

  const lines = text.split(/\r\n|\n|\r/);

  for (let i = 0; i < lines.length; i++) {

    const m = lines[i].match(
      /^(\s*(?:"gfx_viewdistance"|gfx_viewdistance)\s*[:=]\s*)(-?\d+)(\s*,?\s*(?:\/\/.*)?)$/i
    );

    if (m) {

      return {
        line: i,
        prefix: m[1],
        suffix: m[3],
        value: m[2],
        newline: text.includes("\r\n")
          ? "\r\n"
          : text.includes("\r") ? "\r" : "\n"
      };

    }

  }

  return null;

}

async function loadFile(file) {

  originalText = null;
  matchInfo = null;
  $("save").disabled = true;

  if (!file) return;

  $("filename").textContent = file.name;

  if (file.name !== "options.txt") {

    $("loadstatus").className = "status error";

    $("loadstatus").textContent =
      "options.txt 以外のファイルは選択できません。";

    $("savestatus").textContent =
      "正しい options.txt を選択してください。";

    return;

  }

  try {

    const text = await file.text();
    const found = detect(text);

    if (!found) {

      $("loadstatus").className = "status error";

      $("loadstatus").textContent =
        "gfx_viewdistance が見つかりませんでした。";

      return;

    }

    originalText = text;
    fileName = file.name;
    matchInfo = found;

    $("save").disabled = false;

    const current = Number(found.value);

    if (
      current > 0 &&
      current % 16 === 0 &&
      current / 16 <= 96
    ) {

      setChunks(current / 16);

    } else {

      setChunks(16);

    }

    $("loadstatus").className = "status success";

    $("loadstatus").textContent =
      "options.txt の読み込みに成功しました。";

    $("savestatus").textContent =
      "変更するチャンク数を設定してください。";

  } catch (e) {

    $("loadstatus").className = "status error";

    $("loadstatus").textContent =
      "ファイルを読み込めませんでした。";

  }

}

$("file").addEventListener("change", e => {
  loadFile(e.target.files[0]);
});

const drop = $("drop");

["dragenter", "dragover"].forEach(event => {

  drop.addEventListener(event, e => {

    e.preventDefault();
    drop.style.borderColor = "#547D65";

  });

});

["dragleave", "drop"].forEach(event => {

  drop.addEventListener(event, e => {

    e.preventDefault();
    drop.style.borderColor = "#C9C6BD";

  });

});

drop.addEventListener("drop", e => {
  loadFile(e.dataTransfer.files[0]);
});

$("save").onclick = async () => {

  if (originalText === null || !matchInfo) return;

  const lines = originalText.split(/\r\n|\n|\r/);

  lines[matchInfo.line] =
    matchInfo.prefix +
    (Number($("chunkval").textContent) * 16) +
    matchInfo.suffix;

  const blob = new Blob(
    [lines.join(matchInfo.newline)],
    { type: "text/plain;charset=utf-8" }
  );

  const file = new File(
    [blob],
    "options.txt",
    { type: "text/plain" }
  );

  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({ files: [file] })
  ) {

    try {

      await navigator.share({
        files: [file],
        title: "GFX Editor"
      });

      $("savestatus").className = "status success";
      $("savestatus").textContent =
        "ダウンロードしました。";

      return;

    } catch (e) {

      if (e.name === "AbortError") return;

    }

  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "options.txt";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

  $("savestatus").className = "status success";
  $("savestatus").textContent =
    "ダウンロードしました。";

};

$("copy").onclick = async () => {

  const value =
    Number($("chunkval").textContent) * 16;

  try {

    await navigator.clipboard.writeText(String(value));

    $("savestatus").className = "status success";

    $("savestatus").textContent =
      value + " をコピーしました。";

  } catch (e) {

    $("savestatus").textContent =
      "コピーできませんでした。数値: " + value;

  }

};

</script>

</body>
</html>
